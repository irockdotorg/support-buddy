name: Build SupportBuddy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psutil pyinstaller
      - name: Build
        run: |
          python -m PyInstaller \
            --onefile \
            --name "support-buddy-linux" \
            --hidden-import flask \
            --hidden-import psutil \
            --hidden-import werkzeug \
            --hidden-import jinja2 \
            --hidden-import secrets \
            main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-buddy-linux
          path: dist/support-buddy-linux
          retention-days: 30

  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psutil pyinstaller
      - name: Build executable
        run: |
          python -m PyInstaller \
            --onefile \
            --windowed \
            --name "support-buddy" \
            --hidden-import flask \
            --hidden-import psutil \
            --hidden-import werkzeug \
            --hidden-import jinja2 \
            --hidden-import secrets \
            main.py
      - name: Wrap as .app bundle
        shell: bash
        run: |
          APP="dist/support-buddy.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp dist/support-buddy "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/support-buddy"

          python3 - << 'PYEOF'
          import plistlib
          plist = {
              "CFBundleDevelopmentRegion": "English",
              "CFBundleExecutable": "support-buddy",
              "CFBundleIdentifier": "com.supportbuddy.app",
              "CFBundleInfoDictionaryVersion": 6,
              "CFBundleName": "SupportBuddy",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "10.13",
              "NSHighResolutionCapable": True,
          }
          with open("dist/support-buddy.app/Contents/Info.plist", "wb") as f:
              plistlib.dump(plist, f)
          print("Created Info.plist")
          PYEOF

          echo "Built: $APP"
          ls -R "$APP"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-buddy-mac
          path: dist/support-buddy.app
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psutil pyinstaller
      - name: Build
        run: |
          python -m PyInstaller ^
            --onefile ^
            --name "support-buddy-win.exe" ^
            --hidden-import flask ^
            --hidden-import psutil ^
            --hidden-import werkzeug ^
            --hidden-import jinja2 ^
            --hidden-import secrets ^
            main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: support-buddy-win.exe
          path: dist/support-buddy-win.exe
          retention-days: 30

  release:
    runs-on: ubuntu-24.04
    needs: [build-linux, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
