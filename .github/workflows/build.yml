name: Build SupportBuddy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            ext: ""
            name: support-buddy-linux
          - os: macos-14
            target: mac
            name: support-buddy
          - os: windows-latest
            target: win
            ext: ".exe"
            name: support-buddy-win.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psutil pyinstaller

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            python -m PyInstaller \
              --onefile \
              --windowed \
              --name "support-buddy" \
              --hidden-import flask \
              --hidden-import psutil \
              --hidden-import werkzeug \
              --hidden-import jinja2 \
              --hidden-import secrets \
              main.py
          else
            python -m PyInstaller \
              --onefile \
              --name "${{ matrix.name }}" \
              --hidden-import flask \
              --hidden-import psutil \
              --hidden-import werkzeug \
              --hidden-import jinja2 \
              --hidden-import secrets \
              main.py
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.target == 'mac' && 'dist/*.app' || format('dist/{0}', matrix.name) }}
          retention-days: 30

      - name: Upload release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.target == 'mac' && 'dist/*' || format('dist/*{0}', matrix.ext) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
