name: Build SupportBuddy

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            ext: ""
            name: support-buddy-linux
          - os: macos-14
            target: mac
            name: support-buddy
          - os: windows-latest
            target: win
            ext: ".exe"
            name: support-buddy-win.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask psutil pyinstaller

      - name: Build
        shell: bash
        run: |
          python -m PyInstaller \
            --onefile \
            --name "${{ matrix.name }}" \
            --hidden-import flask \
            --hidden-import psutil \
            --hidden-import werkzeug \
            --hidden-import jinja2 \
            --hidden-import secrets \
            main.py

      - name: Wrap Mac build as .app bundle
        if: matrix.target == 'mac'
        shell: bash
        run: |
          APP="dist/support-buddy.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp dist/support-buddy "$APP/Contents/MacOS/"
          chmod +x "$APP/Contents/MacOS/support-buddy"

          python3 - << 'PYEOF'
          import plistlib, datetime

          plist = {
              "CFBundleDevelopmentRegion": "English",
              "CFBundleExecutable": "support-buddy",
              "CFBundleIdentifier": "com.supportbuddy.app",
              "CFBundleInfoDictionaryVersion": 6,
              "CFBundleName": "SupportBuddy",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "1.0",
              "CFBundleVersion": "1",
              "LSMinimumSystemVersion": "10.13",
              "NSHighResolutionCapable": True,
          }
          with open("dist/support-buddy.app/Contents/Info.plist", "wb") as f:
              plistlib.dump(plist, f)
          print("Created Info.plist")
          PYEOF

          echo "Built: $APP"
          ls -la "$APP"
          ls -R "$APP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.target == 'mac' && 'dist/*.app' || format('dist/{0}', matrix.name) }}
          retention-days: 30

      - name: Upload release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.target == 'mac' && 'dist/*.app' || format('dist/*{0}', matrix.ext) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
